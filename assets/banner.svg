<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Lin Ju — AI engineer, software developer, multimodal LLM researcher">
  <title>Lin Ju — AI engineer · software developer · multimodal LLM researcher</title>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0V32M0 32H32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <radialGradient id="glow" cx="0.78" cy="0" r="0.68">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#34d399" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#34d399" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>

    <style>
      .mono {
        font-family: "JetBrains Mono", ui-monospace, "SF Mono", SFMono-Regular,
                     Menlo, Consolas, "DejaVu Sans Mono", monospace;
      }
      .caret { animation: blink 1.15s steps(1, end) infinite; }
      @keyframes blink {
        0%, 55%   { opacity: 1; }
        56%, 100% { opacity: 0.14; }
      }
      @media (prefers-reduced-motion: reduce) {
        .caret { animation: none; }
      }
    </style>
  </defs>

  <rect width="1280" height="300" fill="#0a0e16"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <rect width="1280" height="300" fill="url(#glow)"/>

  <!-- prompt line: ~/lin-ju ❯ whoami -->
  <text class="mono" x="72" y="100" font-size="20" fill="#8b97a8" textLength="96" lengthAdjust="spacing">~/lin-ju</text>
  <polyline points="182,92 191,100 182,108" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="mono" x="205" y="100" font-size="20" fill="#e6edf3">whoami</text>

  <!-- right anchor -->
  <text class="mono" x="1208" y="100" font-size="16" fill="#8b97a8" text-anchor="end">Boston, MA</text>

  <!-- name + block cursor -->
  <text class="mono" x="72" y="192" font-size="92" font-weight="700" fill="#e6edf3" textLength="346" lengthAdjust="spacing">Lin Ju</text>
  <rect class="caret" x="436" y="124" width="18" height="78" rx="1" fill="#34d399"/>

  <text class="mono" x="72" y="246" font-size="20" fill="#8b97a8">AI Engineer <tspan fill="#34d399">·</tspan> Software Developer <tspan fill="#34d399">·</tspan> Multimodal LLM Researcher</text>

  <rect x="0" y="297" width="1280" height="3" fill="url(#rule)"/>
</svg>
